limit_req_zone $binary_remote_addr zone=kangra_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name 201.18.209.226;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kangra.kran-apps.cloud$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 201.18.209.226;

    ssl_certificate /etc/letsencrypt/live/201.18.209.226/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/201.18.209.226/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://kangra.kran-apps.cloud$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kangra.kran-apps.cloud kran-apps.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kangra.kran-apps.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kangra.kran-apps.cloud kran-apps.cloud;

    ssl_certificate /etc/letsencrypt/live/kangra.kran-apps.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kangra.kran-apps.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=kangra_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
