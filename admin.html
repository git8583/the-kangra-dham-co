<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — The Kangra Dham Co.</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: var(--color-bg); }
        .admin-shell { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem 4rem; }
        .admin-card { background: #fff; padding: 1.5rem; border-radius: 14px; box-shadow: var(--shadow-md); margin-top: 1rem; }
        .admin-card input, .admin-card textarea, .admin-card select { width: 100%; padding: .7rem; border: 1px solid #ccc; border-radius: 7px; }
        .admin-card label { display: block; font-weight: 700; margin-top: .75rem; }
        .admin-toolbar { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
        .admin-toolbar select { width: auto; min-width: 190px; }
        .day-editor { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem 1rem; }
        .day-editor .wide { grid-column: 1 / -1; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        .admin-table th, .admin-table td { padding: .65rem; border-bottom: 1px solid #ddd; text-align: left; vertical-align: top; }
        .admin-table select { min-width: 110px; }
        .table-wrap { overflow-x: auto; }
        #adminApp[hidden], #loginCard[hidden] { display: none; }
        .admin-message { min-height: 1.5rem; margin-top: .75rem; font-weight: 600; }
        @media (max-width: 650px) { .day-editor { grid-template-columns: 1fr; } .day-editor .wide { grid-column: auto; } }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <main class="admin-shell" id="main-content">
        <h1>Restaurant Admin</h1>
        <p>Manage the live weekly menu and customer enquiries.</p>

        <section class="admin-card" id="loginCard">
            <form id="loginForm">
                <label for="adminPassword">Admin password</label>
                <input type="password" id="adminPassword" autocomplete="current-password" minlength="12" required>
                <button class="btn btn-primary" type="submit" style="margin-top:1rem">Sign in</button>
                <p class="admin-message" id="loginMessage" role="status" aria-live="polite"></p>
            </form>
        </section>

        <div id="adminApp" hidden>
            <div class="admin-toolbar">
                <button class="btn btn-outline" id="logoutButton" type="button">Sign out</button>
                <span id="globalMessage" class="admin-message" role="status" aria-live="polite"></span>
            </div>

            <section class="admin-card">
                <h2>Weekly menu</h2>
                <div class="admin-toolbar">
                    <label for="daySelect">Edit day</label>
                    <select id="daySelect"></select>
                    <label for="overrideSelect">Today's override</label>
                    <select id="overrideSelect">
                        <option value="">Automatic (calendar day)</option>
                    </select>
                </div>
                <form id="menuForm" class="day-editor" autocomplete="off">
                    <label>Title<input type="text" name="title" maxlength="100" required></label>
                    <label>Price<input type="text" name="price" maxlength="50" required></label>
                    <label class="wide">Madra<textarea name="madra" maxlength="500" required></textarea></label>
                    <label class="wide">Khatta / secondary<textarea name="khatta" maxlength="500" required></textarea></label>
                    <label class="wide">Note<textarea name="note" maxlength="300" required></textarea></label>
                    <label>Emoji<input type="text" name="emoji" maxlength="20" required></label>
                    <label>Image URL<input name="image" type="url" maxlength="1000"></label>
                    <label><input name="highlight" type="checkbox" style="width:auto"> Highlight this day</label>
                    <div class="wide"><button class="btn btn-primary" type="submit">Save menu</button></div>
                </form>
            </section>

            <section class="admin-card">
                <h2>Change Admin Password</h2>
                <form id="passwordForm">
                    <label for="currentPassword">Current password</label>
                    <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" minlength="12" maxlength="128" required>
                    <label for="newPassword">New password</label>
                    <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                    <label for="confirmPassword">Confirm new password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
                    <button class="btn btn-primary" type="submit" style="margin-top:1rem">Update Password</button>
                </form>
            </section>

            <section class="admin-card">
                <h2>Enquiries</h2>
                <div class="table-wrap">
                    <table class="admin-table">
                        <thead><tr><th>Date</th><th>Customer</th><th>Request</th><th>Message</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody id="enquiryRows"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    <script src="js/admin.js"></script>
</body>
</html>
